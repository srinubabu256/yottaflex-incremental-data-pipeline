[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-incremental-data-pipeline"
version = "1.0.0"
description = "YottaFlex - Production-grade Incremental Data Engineering Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "YottaFlex Engineering Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
python_files = "test_*.py"
pythonpath = [
    ".",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
